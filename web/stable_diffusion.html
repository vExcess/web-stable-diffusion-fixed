<script>
  var tvmjsGlobalEnv = tvmjsGlobalEnv || {};
</script>

<script type="module">
  import { CLIPTokenizer } from "./dist/clip_tokenizer.js";
  import { exportModelCache, fetchAndCacheText, getModelCacheStatus, importModelCache } from "./dist/model_pack.js";

  function uiLogger(message) {
    console.log(message);
    const log = document.getElementById("log");
    if (!log) {
      return;
    }
    const d = document.createElement("div");
    d.textContent = message;
    log.appendChild(d);
  }

  function reportCacheProgress(info) {
    const label = document.getElementById("progress-tracker-label");
    const bar = document.getElementById("progress-tracker-progress");
    if (label) {
      label.innerHTML = info.text;
    }
    if (bar && info.total) {
      bar.value = (info.current / info.total) * 100;
    }
  }

  async function refreshCacheStatus() {
    const status = document.getElementById("model-cache-status");
    if (!status) {
      return;
    }
    try {
      const info = await getModelCacheStatus();
      status.textContent = info.count
        ? ("Local model cache: " + info.count + " files. Save downloads one .tar.gz; Load that same file in the other browser.")
        : "Local model cache: empty. Generate once to download from Hugging Face, then save the cache.";
    } catch (err) {
      status.textContent = "";
    }
  }

  async function fetchTokenizerJson(name) {
    if (!name) {
      throw Error("Missing tokenizer name in stable-diffusion-config.json");
    }
    return fetchAndCacheText([
      "https://huggingface.co/" + name + "/resolve/main/tokenizer.json",
      "https://huggingface.co/" + name + "/raw/main/tokenizer.json",
      "dist/tokenizers/" + name + "/tokenizer.json"
    ]);
  }

  async function getTokenizer(name) {
    const jsonText = await fetchTokenizerJson(name);
    return CLIPTokenizer.fromJson(jsonText);
  }

  tvmjsGlobalEnv.getTokenizer = getTokenizer;
  tvmjsGlobalEnv.refreshCacheStatus = refreshCacheStatus;
  tvmjsGlobalEnv.asyncOnExportModel = async function () {
    try {
      await exportModelCache({ logger: uiLogger, report: reportCacheProgress });
      await refreshCacheStatus();
    } catch (err) {
      if (err && err.name === "AbortError") {
        return;
      }
      uiLogger("Save model cache error, " + err.toString());
    }
  };
  async function loadSelectedCache(files) {
    try {
      await importModelCache({
        files: files,
        logger: uiLogger,
        report: reportCacheProgress
      });
      await refreshCacheStatus();
    } catch (err) {
      if (err && err.name === "AbortError") {
        return;
      }
      uiLogger("Load model cache error, " + err.toString());
    }
  }

  const cacheFileInput = document.getElementById("modelCacheFilesInput");
  if (cacheFileInput) {
    cacheFileInput.addEventListener("change", function () {
      if (!cacheFileInput.files || cacheFileInput.files.length === 0) {
        return;
      }
      loadSelectedCache(cacheFileInput.files);
    });
  }

  tvmjsGlobalEnv.asyncOnImportModel = async function () {
    const input = document.getElementById("modelCacheFilesInput");
    if (!input) {
      uiLogger("Load model cache error, file picker is missing.");
      return;
    }
    input.value = "";
    if (typeof input.showPicker === "function") {
      try {
        input.showPicker();
        return;
      } catch (err) {
        // Fall back to input.click() when showPicker is blocked.
      }
    }
    input.click();
  };

  refreshCacheStatus();
</script>

<div>
  Select Model:   <select name="model" id="modelId">
    <option selected="selected">Stable-Diffusion-XL</option>
    <option>Stable-Diffusion-1.5</option>
  </select>
</div>

<script src="dist/stable_diffusion.js"></script>

<div>
  Input prompt: <input
  name="inputPrompt"
  id="inputPrompt"
  type="text"
  value="A photo of an astronaut riding a horse on mars"
  size="77"/> <br>
  Negative prompt (optional): <input
  name="negativePrompt"
  id="negativePrompt"
  type="text"
  value=""
  size="77"/>
</div>

<div>
  Select scheduler -
  <select name="scheduler" id="schedulerId">
    <option value="0">Multi-step DPM Solver (20 steps)</option>
    <option value="1">PNDM (50 steps)</option>
    <option value="2">Euler Discrete Scheduler</option>
  </select>

  <br>

  Render intermediate steps (may slow down execution) -
  <select name="vae-cycle" id="vaeCycle">
    <option value="-1">No</option>
    <option value="2">Run VAE every two UNet steps after step 10</option>
  </select>

  <div id="progress">
    <label id="gpu-tracker-label"></label><br>
    <label id="progress-tracker-label"></label><br>
    <progress id="progress-tracker-progress" max="100" value="100"> </progress>
  </div>
  <button type="button" onclick="tvmjsGlobalEnv.asyncOnGenerate()">Generate</button>
  <button type="button" onclick="tvmjsGlobalEnv.asyncOnExportModel()">Save model cache</button>
  <button type="button" onclick="tvmjsGlobalEnv.asyncOnImportModel()">Load model cache</button>
  <input id="modelCacheFilesInput" type="file" accept=".tar.gz,.tgz,.tar,application/gzip,application/x-gzip,application/x-tar" style="position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0)" />
  <div id="model-cache-status"></div>
</div>

<script>
  function updateSchedulerBasedOnModel() {
      var selectedModel = document.getElementById('modelId').value;
      var schedulerDropdown = document.getElementById('schedulerId');
      
      if (selectedModel === 'Stable-Diffusion-XL') {
          schedulerDropdown.value = '2'; // Set to Multi-step DPM Solver
          // Optionally, disable other options
          for (var i = 0; i < schedulerDropdown.options.length; i++) {
              schedulerDropdown.options[i].disabled = (schedulerDropdown.options[i].value !== '2');
          }
      } else {
          schedulerDropdown.value = '0'; // Set to Multi-step DPM Solver
          // Optionally, disable other options
          for (var i = 0; i < schedulerDropdown.options.length; i++) {
              schedulerDropdown.options[i].disabled = (schedulerDropdown.options[i].value !== '0' && schedulerDropdown.options[i].value !== '1');
          }
      }
  }

  window.onload = function() {
      updateSchedulerBasedOnModel(); // Run when page loads
      document.getElementById('modelId').addEventListener('change', updateSchedulerBasedOnModel); // Also run on model change
  }
</script>

<div>
<canvas id="canvas" width="512" height="512"></canvas>
</div>
